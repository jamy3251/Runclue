plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing config
// 1. Create keystore: keytool -genkey -v -keystore ~/runclue-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias runclue
// 2. Create android/key.properties:
//    storePassword=<password>
//    keyPassword=<password>
//    keyAlias=runclue
//    storeFile=<path>/runclue-release.jks
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def envFile = rootProject.file("../.env")
def envProperties = new Properties()
if (envFile.exists()) {
    envFile.withInputStream { stream ->
        envProperties.load(stream)
    }
}
def mapsApiKey = envProperties.getProperty("GOOGLE_MAPS_API_KEY")
        ?: System.getenv("GOOGLE_MAPS_API_KEY")
        ?: ""

android {
    namespace = "com.runclue.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.runclue.app"
        minSdk = 23  // Google Maps, Camera2, Geolocator 요구사항
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        // Flutter의 기본 placeholders(${applicationName} 등)를 덮어쓰지 않도록 인덱스 할당으로 추가
        manifestPlaceholders["MAPS_API_KEY"] = mapsApiKey
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            // 진단용: ProGuard/R8 일시 비활성화. Note 9 등 구형 디바이스 호환성 검증 후 다시 활성화 예정.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
